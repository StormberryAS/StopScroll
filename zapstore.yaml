# Zapstore publishing manifest (https://zapstore.dev/docs/publish).
#
# `pubkey` is load-bearing, not decoration: on a first publish the Zapstore relay
# fetches this file from the repository and whitelists the key it finds here, so
# it must stay identical to the key `zsp` signs with (SIGN_WITH). It is the
# Stormberry AS nostr identity, the same one behind nostr.json at stormberry.as.
#
# Publish a release with the config file, and only once the release workflow has
# finished and the GitHub release exists (zsp takes whatever release is there):
#   SIGN_WITH=<nsec|bunker://...> zsp publish zapstore.yaml
# Not `zsp publish -r ...`: that reads the repository instead of this file and
# drops the tags, the licence and the website.
repository: https://github.com/StormberryAS/StopScroll
pubkey: npub1zz9w77p2jkn95t0st9tcuea8zdn2vknf0ctrwyd4g46w3kswdccqesr0pa

name: StopScroll
summary: "Closes the short-video feeds, keeps the rest of each app. No ads. No internet."
description: |
  StopScroll closes the endless short-video feeds in the YouTube, Instagram
  and X apps on your Android phone and leaves the rest of each app working.
  When the Shorts or Reels player opens, StopScroll presses Back for you.
  Search, subscriptions, normal videos, Stories, messages and profiles keep
  working. A Reel someone sends you in a message is closed too.

  In X, the feed is the full-screen video viewer, where you swipe up for the
  next video. X opens it when you tap a video in the timeline, a post, search
  or a profile, so StopScroll closes it there too. Videos still play in the
  timeline, in posts and in search.

  No ads, no account, no server calls. StopScroll has no internet permission
  at all, so it never contacts a server, ours or anyone else's. It shows no
  ads and needs no account.

  For each app you choose: Off, or Always block.

  This version works with YouTube, Instagram and X. More apps will follow in
  later releases, each one once its screens have been checked on a phone.

  How it works: StopScroll uses Android's Accessibility Service, the strongest
  access Android has, so it is built to be checked.
  - It watches only the YouTube, Instagram and X apps. Each time it checks the
    screen, it first reads which app is in front; if that is not one of those
    three, it stops there and reads nothing else.
  - It reads the names and positions of the parts of the screen to see whether
    a short-video feed is open. It does not read the words on your screen: not
    your messages, captions, passwords or anything you type.
  - It can press only Back (twice if needed), then one tab in the same app
    where there is one, then Home.
  - It asks first: before Android's Accessibility settings open, and before it
    watches an app that a later version adds, the app shows what it looks at,
    what it does and what it keeps, and waits for "I agree".
  - It has no internet permission, so it cannot connect to anything itself.
    Links open in your browser or mail app, in front of you.
  - It keeps your settings, the date you agreed and a few counts, such as when
    it last closed a feed, on your phone only, left out of backups.
  - The code is open source (MIT): https://github.com/StormberryAS/StopScroll

  No app permissions at all: Android's App info for StopScroll lists none. The
  Accessibility access is separate, and you turn it on yourself.

  What it cannot do: a frame or a moment of sound can get through before the
  feed closes. When YouTube, Instagram or X changes its screens, StopScroll
  may miss the feed until it is updated. On Android 17 with Advanced
  Protection turned on, Android does not allow apps like StopScroll to use
  Accessibility.

  StopScroll is not an accessibility tool and not parental control: you can
  turn it off at any time, in the app or in Android's settings.

  Its settings page runs from inside the app, offline, and every build checks
  that each bundled file is byte for byte the one in the source code, apart
  from one added line in index.html that loads the bridge to Android. The
  privacy page and the full disclaimer open from the app's footer. In English
  only.

  Not affiliated with or endorsed by Google, YouTube, Meta, Snap, LinkedIn or
  X.

  A functioning prototype from Stormberry AS, Norway, MIT licensed, so expect
  gaps and changes.

tags:
  - digitalwellbeing
  - focus
  - shortvideo
  - privacy
  - offline

license: MIT

# StopScroll has no website of its own yet (stopscroll.stormberry.as is not set
# up, 29 October 2026). Point this at it once that site is live; the source
# repository is named above.
website: https://stormberry.as/labs

# The release text Zapstore shows for this version. Without this line zsp takes the
# GitHub release body, which the workflow leaves to GitHub's generated notes. A plain
# text file is used whole. Point it at the changelog of the versionCode being
# released, and change the number at every release.
release_notes: ./fastlane/metadata/android/en-US/changelogs/3.txt

# The APK ships no raster icon (the launcher icon is an adaptive-icon XML built
# from vectors), and a store front-end without a bitmap shows an empty tile. So
# the icon is supplied here, rendered from favicon.svg by
# android/tools/build-store-icon.py with the same scale and offset as the launcher.
icon: ./fastlane/metadata/android/en-US/images/icon.png

# Phone screenshots of the 0.0.3 release candidate on an Android 16 emulator
# (API 36), 1080x1920, palette PNGs under 250 KB (Zapstore's Blossom server refuses
# files of about 700 KB). zsp uploads these and references them from the app event.
images:
  - ./fastlane/metadata/android/en-US/images/phoneScreenshots/01-what-it-does.png
  - ./fastlane/metadata/android/en-US/images/phoneScreenshots/02-disclosure.png
  - ./fastlane/metadata/android/en-US/images/phoneScreenshots/03-apps.png

# No release_source: zsp pulls the APK straight from the GitHub release, so the
# asset URL in the nostr event points at the same signed binary the release page
# serves and the attestation covers. The release workflow uploads two files,
# stopscroll-v<version>.apk and stopscroll-v<version>.apk.sha256 (the tag
# android-v0.0.1 gives stopscroll-v0.0.1.apk). The pattern matches the APK and
# never the .sha256 file. Keep it in step with .github/workflows/android-release.yml.
match: "stopscroll-.*\\.apk$"
