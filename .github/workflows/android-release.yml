name: Android release

# StopScroll's release workflow, written on 29 October 2026 from GDPRLetterBuilder's of the same day,
# itself from EclipseTracker's (released 2.0.0 on 17 October 2026 with it) and CheckLink's (0.0.1 on
# 15 October 2026): the same two jobs, the same pinned actions, the same order of checks. What
# differs: no permission at all (expected-permissions.txt holds only the package line), the watched
# app list (YouTube and Instagram since 0.0.2, X since 0.0.3, YouTube Music since 0.0.4, read from the APK's own service configuration), this app's file list
# (WebAssets.INCLUDES in android/app/build.gradle.kts; tests/release.test.ts keeps the two equal),
# its licences, the rules file, its file name stopscroll-v<version>.apk, and its pinned certificate.
#
# Tagged android-v* only, and nothing else starts it: there is no manual run, so no branch can ever
# reach the signing secrets.
#
# TWO JOBS, so that build tools never come near the app's signing key or GitHub's signing token:
#
#   build    refuses a release while a text is marked DRAFT, runs the TypeScript check, the Node
#            tests, the Kotlin tests, the bundled-file check and lint, and has Gradle build the
#            release APK UNSIGNED. It can only read the repository: no secret, no key, no password,
#            and no token that can write or sign anything. Gradle, Node and everything they download
#            run here and nowhere else.
#
#   release  runs NO Gradle, no Node and no code from the build. It takes the unsigned APK as data
#            and checks it BEFORE the key is decoded: no permission but the package line, no
#            INTERNET, not debuggable, the version the tag names, the watched app list, every
#            bundled file byte for byte against the tagged commit, the rules file and the licence
#            texts. Then it aligns and signs that same file with Google's zipalign and apksigner,
#            using the permanent key from the "release" environment, and checks the result: one
#            signer, StopScroll's pinned certificate, and the same files as the APK it checked. Only
#            then does it attest and publish. The tokens that write (contents) and sign the
#            provenance record (id-token) exist in this job alone.
#
# What the split does not cover: the release job signs the code the build job compiled, so a build
# dependency that went bad could still put its own code into classes.dex. The checks cover the
# permissions, the manifest's flags, the service configuration and the bundled files, not the
# compiled code. Two clean local builds of the release commit gave the same bytes; README.md,
# "Reproducible build", has the steps to compare any release with a build of your own.
#
# SET-UP ON GITHUB, before the first tag (repository Settings), made by the kit's repo-setup.sh and
# read back by it:
#   1. Environment "release", deployment rule: tags matching android-v* only, no branch rule.
#   2. Its secrets: KEYSTORE_BASE64 (the .p12 file, base64), KEYSTORE_PASSWORD, KEY_ALIAS,
#      KEY_PASSWORD. None of them as a repository secret.
#   3. Required reviewers on that environment: Marcos's two accounts, so each release waits for one
#      click on the run's page before the key is handed over.
#   4. A tag ruleset for android-v*: creation, update and deletion restricted, organisation admins
#      (Marcos's two accounts) may bypass. GitHub runs the workflow file of the tagged commit, so
#      without 3 and 4 anyone who could push such a tag could point it at a commit whose release job
#      sends the key elsewhere.
on:
  push:
    tags: ["android-v*"]

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android

    # Every action is pinned to a full commit hash, with its release in the comment, the same pins
    # as GDPRLetterBuilder's, EclipseTracker's and CheckLink's workflows. A tag such as v6 can be
    # moved to other code; a commit hash cannot. To update a pin, resolve the new release with
    #   git ls-remote https://github.com/<owner>/<repo>.git 'refs/tags/<tag>*'
    # and take the ^{} line for an annotated tag. Only a stable release, and only once it is 3 days
    # old, unless it fixes a security problem that reaches this workflow (rule since 2026-10-22).
    steps:
      # No credentials are left in .git/config for the build to find.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The store texts (fastlane/ and zapstore.yaml), README.md, CHANGELOG.md and the in-app texts
      # (ts/core/copy.ts and strings.xml, whose markers also cover privacy.html, index.html, the
      # DISCLAIMER section and the report email) are written as DRAFTs (29 October 2026 for 0.0.1,
      # 30 October 2026 for 0.0.2; the 0.0.3 and 0.0.4 texts were final when written, 31 October 2026), each
      # marked by a line that says so. zsp
      # publishes the store texts as they are, so no release may be built while one still carries
      # that line: Marcos approves the texts and the line is removed.
      - name: Refuse to release while a text is marked DRAFT
        working-directory: .
        run: |
          set -euo pipefail
          if grep -rln 'DRAFT, not approved' fastlane zapstore.yaml README.md CHANGELOG.md privacy.html \
               ts/core/copy.ts android/app/src/main/res/values/strings.xml; then
            echo "::error::the files above are still marked DRAFT; approve the texts and remove the DRAFT lines first"
            exit 1
          fi
          echo "No text is marked DRAFT."

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      # Node 24 for the TypeScript checks: the compiled JavaScript, the Android bridge
      # (android-bridge.js, compiled from android-bridge.ts and committed) and the Node tests, which
      # Node 24 runs directly. No npm cache. The Gradle build itself never runs Node or tsc.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # No Gradle cache: nothing another run left behind can change what this build reads.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # The runner ships an Android SDK, but not necessarily platform 37.1, and its bundled
      # sdkmanager may be too old to know that package exists. Refresh cmdline-tools first.
      - name: Install SDK packages the runner may not have
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "cmdline-tools;latest" > /dev/null
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;36.0.0"

      # tools/build-ts.sh --check installs the pinned TypeScript with npm ci (frozen, no install
      # scripts) and fails unless app.js, core/*.js and android/web-overlay/android-bridge.js are byte
      # for byte what their TypeScript compiles to and the tests type-check. Then the Node tests,
      # among them the guards (no hand-written JavaScript; no screen-text API; only Back, Home and
      # one tab; the watched app list) and tests/release.test.ts (this workflow's file list, the
      # pinned certificate, the store texts).
      - name: Check the compiled TypeScript and run the Node tests
        working-directory: .
        run: |
          set -euo pipefail
          node --version
          tools/build-ts.sh --check
          node --test tests/*.test.ts

      # verifyWebAssets fails unless every bundled file is byte-identical to the repository's
      # (index.html may differ only by the single injected bridge line).
      - name: Kotlin tests, the bundled files and lint
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache :app:testDebugUnitTest :app:verifyWebAssets :app:lintRelease

      # -PunsignedRelease=true is the only way the build makes a release APK without signing it,
      # and the build refuses it if a signing password is anywhere in reach.
      - name: Build the release APK, unsigned
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache -PunsignedRelease=true :app:assembleRelease

      # Only the APK leaves this job. The release job checks everything else against the tagged
      # commit itself, so nothing else the build wrote is trusted.
      - name: Make sure it is unsigned, and set it aside
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          [ -s "$APK" ] || { echo "::error::$APK was not built"; exit 1; }
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK" > /dev/null 2>&1; then
            echo "::error::the build job made a signed APK; it must never hold a key"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/handover"
          cp "$APK" "$RUNNER_TEMP/handover/stopscroll-unsigned.apk"
          sha256sum "$RUNNER_TEMP/handover/stopscroll-unsigned.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stopscroll-unsigned
          path: ${{ runner.temp }}/handover/stopscroll-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    # The signing secrets live in this environment, which only android-v* tags may use, and which
    # waits for one of the required reviewers before this job starts.
    environment: release
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance attestation
      attestations: write    # publish it
    defaults:
      run:
        working-directory: android

    # No Gradle, no Node, no setup-gradle and no build output but the APK. Every tool here is
    # Google's (zipalign, apksigner, aapt2 from build-tools 36.0.0) or the runner's own.
    steps:
      # The tagged commit, for expected-permissions.txt, LICENSE, the licence texts, the rules and the
      # files the APK must carry byte for byte. Nothing in it is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install build-tools 36.0.0 (zipalign, apksigner, aapt2)
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;36.0.0"
          for t in zipalign apksigner aapt2; do
            [ -x "$ANDROID_HOME/build-tools/36.0.0/$t" ] || { echo "::error::build-tools 36.0.0 has no $t"; exit 1; }
          done

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stopscroll-unsigned
          path: ${{ runner.temp }}/handover

      # Everything about what the APK holds is checked BEFORE the key is decoded, on the very file the
      # build job handed over: a bad APK never comes near the key.
      - name: Check the unsigned APK (permissions, debuggable, version, watched apps, files, licences)
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/handover/stopscroll-unsigned.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"

          # FAIL CLOSED, in both directions: `dump permissions` must print exactly what
          # android/expected-permissions.txt holds, which is the package line and nothing else. The
          # output is compared whole, so any uses-permission or permission line fails, and so does an
          # aapt2 that cannot read the APK. README.md, privacy.html and the store texts all say "no
          # permissions", so this check is what keeps them true.
          DUMP=$("$AAPT" dump permissions "$APK")
          EXPECTED_PERMISSIONS=$(cat expected-permissions.txt)
          if [ "$DUMP" != "$EXPECTED_PERMISSIONS" ]; then
            echo "::error::APK permissions differ from android/expected-permissions.txt"
            echo "expected:"; printf '%s\n' "$EXPECTED_PERMISSIONS"
            echo "actual:";   printf '%s\n' "$DUMP"
            exit 1
          fi
          if printf '%s\n' "$DUMP" | grep -q "permission"; then
            echo "::error::the APK asks for a permission; StopScroll asks for none"; exit 1
          fi
          echo "Verified: no permission at all (exactly expected-permissions.txt), so no INTERNET."

          # A release build must never be debuggable.
          BADGING=$("$AAPT" dump badging "$APK")
          if printf '%s\n' "$BADGING" | grep -q "^application-debuggable"; then
            echo "::error::the release APK is debuggable"
            exit 1
          fi
          echo "Verified: not debuggable."

          # A tag must match the version inside the APK, or the release would publish a misnamed
          # binary that Zapstore cannot offer as an update.
          VERSION_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
          PACKAGE=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          echo "APK $PACKAGE versionName $VERSION_NAME, versionCode $VERSION_CODE"
          [ "$PACKAGE" = no.stormberry.stopscroll ] || { echo "::error::the APK is $PACKAGE, not no.stormberry.stopscroll"; exit 1; }
          if [ "v$VERSION_NAME" != "${GITHUB_REF_NAME#android-}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the APK's versionName $VERSION_NAME; bump versionName and versionCode in android/app/build.gradle.kts"
            exit 1
          fi
          [ -s "../fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt" ] \
            || { echo "::error::no release note fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"; exit 1; }
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Verified: package, tag and versionName agree; the release note for versionCode $VERSION_CODE exists."

          # THE WATCHED APPS. The Accessibility Service's configuration inside the APK must name
          # exactly YouTube, Instagram, X and YouTube Music (0.0.4), in that order, and exactly the packages of
          # rules/screen-rules.json, with notificationTimeout 0 and isAccessibilityTool false. The
          # pinned list below changes only by hand, with a new disclosure and a new Play declaration
          # (spec 9.1); a rules file that names one more app fails here as well. The coming-soon apps
          # in the app's list are names on the screen only and must never reach this list.
          SVC=$("$AAPT" dump resources "$APK" | grep -A2 'xml/accessibility_service_config$' | sed -n 's#.*(file) \(res/[^ ]*\.xml\) type=XML.*#\1#p' | head -1)
          [ -n "$SVC" ] || { echo "::error::cannot find the service configuration in the APK"; exit 1; }
          XML=$("$AAPT" dump xmltree --file "$SVC" "$APK")
          GOT=$(printf '%s\n' "$XML" | sed -n 's/.*packageNames.*="\([^"]*\)".*/\1/p' | head -1)
          PINNED_APPS=com.google.android.youtube,com.instagram.android,com.twitter.android,com.google.android.apps.youtube.music
          WANT=$(python3 -I -c 'import json,sys; print(",".join(a["package"] for a in json.load(open(sys.argv[1]))["apps"]))' ../rules/screen-rules.json)
          [ "$WANT" = "$PINNED_APPS" ] || { echo "::error::the rules cover '$WANT', not exactly '$PINNED_APPS'"; exit 1; }
          [ -n "$GOT" ] && [ "$GOT" = "$WANT" ] || { echo "::error::the service watches '$GOT', not exactly the rules' '$WANT'"; exit 1; }
          printf '%s\n' "$XML" | grep -q 'notificationTimeout.*=0$' || { echo "::error::notificationTimeout is not 0"; exit 1; }
          printf '%s\n' "$XML" | grep -q 'isAccessibilityTool.*=false$' || { echo "::error::isAccessibilityTool is not false"; exit 1; }
          echo "Verified: the service watches exactly $GOT; notificationTimeout 0; not an accessibility tool."

          # The licence texts outside assets/web/: the app's own MIT licence, the Apache License for
          # the AndroidX and Kotlin libraries and THIRD-PARTY.txt, which lists them.
          for f in Apache-2.0.txt StopScroll-MIT.txt THIRD-PARTY.txt; do
            unzip -l "$APK" "assets/licences/$f" > /dev/null || { echo "::error::assets/licences/$f missing from the APK"; exit 1; }
          done
          unzip -p "$APK" assets/licences/StopScroll-MIT.txt | cmp -s - ../LICENSE \
            || { echo "::error::assets/licences/StopScroll-MIT.txt is not the tagged LICENSE"; exit 1; }
          unzip -p "$APK" assets/licences/Apache-2.0.txt | cmp -s - licences/Apache-2.0.txt \
            || { echo "::error::assets/licences/Apache-2.0.txt is not the tagged android/licences/Apache-2.0.txt"; exit 1; }
          unzip -p "$APK" assets/rules/screen-rules.json | cmp -s - ../rules/screen-rules.json \
            || { echo "::error::assets/rules/screen-rules.json is not the tagged rules file"; exit 1; }
          echo "Verified: the licence texts are bundled, the app's own is the tagged LICENSE, and the rules file is the tagged one."

          # EVERY bundled page and file, byte for byte, against the tagged commit and not against
          # anything the build job wrote. The expected set is the app's include list (WebAssets.INCLUDES
          # in android/app/build.gradle.kts; tests/release.test.ts keeps the two equal) read from this
          # checkout, plus the bridge script. assets/web/ must hold exactly that set; each file must
          # equal the commit's copy, index.html apart from the one injected bridge line, and
          # android-bridge.js must equal android/web-overlay/android-bridge.js, which the build job
          # proved is what android-bridge.ts compiles to.
          shopt -s nullglob
          EXPECTED_WEB=$(cd .. && for f in index.html privacy.html disclaimer.html disclaimer.css app.js core/*.js \
                                         style.css favicon.svg apple-touch-icon.png fonts/inter/inter.css \
                                         fonts/inter/InterVariable.woff2 fonts/inter/InterVariable-Italic.woff2 \
                                         licences/*.txt; do
                           [ -f "$f" ] && printf '%s\n' "$f"
                         done; echo android-bridge.js)
          EXPECTED_WEB=$(printf '%s\n' "$EXPECTED_WEB" | sort -u)
          IN_APK=$(unzip -Z1 "$APK" | sed -n 's#^assets/web/##p' | grep -v '/$' | sort -u)
          if [ "$EXPECTED_WEB" != "$IN_APK" ]; then
            echo "::error::the APK's bundled files are not exactly the tagged ones"
            diff <(printf '%s\n' "$EXPECTED_WEB") <(printf '%s\n' "$IN_APK") || true
            exit 1
          fi
          TAG_LINE='<script src="android-bridge.js"></script>'
          WEB_FILES=0
          while IFS= read -r f; do
            case "$f" in
              android-bridge.js)
                unzip -p "$APK" "assets/web/$f" | cmp -s - web-overlay/android-bridge.js \
                  || { echo "::error::assets/web/android-bridge.js differs from android/web-overlay"; exit 1; } ;;
              index.html)
                [ "$(unzip -p "$APK" assets/web/index.html | grep -cx "[[:space:]]*$TAG_LINE")" = 1 ] \
                  || { echo "::error::index.html must carry the bridge line exactly once"; exit 1; }
                unzip -p "$APK" assets/web/index.html | grep -vx "[[:space:]]*$TAG_LINE" | cmp -s - ../index.html \
                  || { echo "::error::index.html differs from the tagged one by more than the bridge line"; exit 1; } ;;
              *)
                unzip -p "$APK" "assets/web/$f" | cmp -s - "../$f" \
                  || { echo "::error::assets/web/$f differs from the tagged commit"; exit 1; } ;;
            esac
            WEB_FILES=$((WEB_FILES + 1))
          done <<< "$IN_APK"
          echo "Verified: all $WEB_FILES bundled files are the tagged ones, byte for byte (index.html apart from the bridge line)."

          # The file the next steps sign must be this one.
          sha256sum "$APK" > "$RUNNER_TEMP/checked.sha256"

      # StopScroll's own key (one key per app): ~/.android-keys/stormberry-stopscroll-release.p12,
      # PKCS12, alias release, RSA-4096, created 29 October 2026; permanent from the first Zapstore
      # release. Both later checks read the pin from here.
      - name: Read the pinned certificate
        id: pin
        run: |
          set -euo pipefail
          EXPECTED_CERT=1e4aa9ee4d927009dbe8ba17cfd05f496213e6001adf79afdb2d5b90dbc5591a
          if ! printf '%s' "$EXPECTED_CERT" | grep -Eqx '[0-9a-f]{64}'; then
            echo "::error::the release certificate is not pinned"
            exit 1
          fi
          echo "cert=$EXPECTED_CERT" >> "$GITHUB_OUTPUT"

      # The keystore is decoded into RUNNER_TEMP, outside the workspace, so no artifact glob or
      # accidental `git add` can ever pick it up, and it is shredded straight after.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      # zipalign first: the APK Signature Scheme covers the whole file, so nothing may move after
      # signing. The passwords reach apksigner as environment variables, never on its command line.
      # v1 (JAR) signing is off because minSdk 33 makes it dead weight, v2 and v3 are on (v3 keeps
      # key rotation possible later): the same schemes the Gradle build's local signing config pins.
      - name: Align and sign with apksigner
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          IN="$RUNNER_TEMP/handover/stopscroll-unsigned.apk"
          sha256sum -c --quiet "$RUNNER_TEMP/checked.sha256"
          "$BUILD_TOOLS/zipalign" -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out "$RUNNER_TEMP/stopscroll-release.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/aligned.apk"

      - name: Remove keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/release.p12" || rm -f "$RUNNER_TEMP/release.p12"

      # Fails the release if signing went wrong, if the certificate is not the pinned one, or if
      # aligning and signing changed, added or dropped any file of the APK checked above.
      - name: Verify signature and certificate, and that signing changed no file
        env:
          EXPECTED_CERT: ${{ steps.pin.outputs.cert }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/stopscroll-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          "$BUILD_TOOLS/zipalign" -c 4 "$APK" > /dev/null || { echo "::error::the APK is not aligned"; exit 1; }
          CERTS=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")
          printf '%s\n' "$CERTS"

          # Exactly one signer, so the pin below speaks for the whole APK.
          if ! printf '%s\n' "$CERTS" | grep -qx 'Number of signers: 1'; then
            echo "::error::the APK must have exactly one signer"
            exit 1
          fi

          # PIN THE SIGNING CERTIFICATE, do not merely check that one exists. apksigner's exit status
          # catches an UNSIGNED apk, but an apk validly signed with the WRONG key passes it and
          # reaches the release. Android enforces certificate continuity, so publishing under the
          # wrong key permanently forks the install base: existing users would get
          # INSTALL_FAILED_UPDATE_INCOMPATIBLE and the only fix is uninstalling.
          printf '%s' "$EXPECTED_CERT" | grep -Eqx '[0-9a-f]{64}' || { echo "::error::no pinned certificate"; exit 1; }
          ACTUAL_CERT=$(printf '%s\n' "$CERTS" \
            | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}')
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::signing certificate mismatch"
            echo "  expected $EXPECTED_CERT"
            echo "  actual   $ACTUAL_CERT"
            exit 1
          fi
          echo "Signing certificate matches the pinned fingerprint."

          # The same files as the APK checked before signing: each name, size, CRC-32 and
          # compression, in the same order (v1 signing is off, so nothing is added to META-INF).
          python3 - "$RUNNER_TEMP/handover/stopscroll-unsigned.apk" "$APK" <<'PY'
          import sys, zipfile
          entries = [[(i.filename, i.file_size, i.CRC, i.compress_type) for i in zipfile.ZipFile(p).infolist()] for p in sys.argv[1:3]]
          if entries[0] != entries[1]:
              print("::error::signing changed the files of the APK that was checked")
              sys.exit(1)
          print(f"Verified: the signed APK holds the same {len(entries[1])} files as the APK checked before signing.")
          PY

      # Lets anyone prove this exact binary came out of this repository and this run:
      #   gh attestation verify stopscroll-v0.0.4.apk -R StormberryAS/StopScroll
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/stopscroll-release.apk

      # The release text is the release note of this versionCode (fastlane changelogs), the same text
      # zsp gives Zapstore (zapstore.yaml release_notes).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Strips only the "android-" prefix, so the tag android-v0.0.1 yields v0.0.1 and the asset
          # carries the v: stopscroll-v0.0.1.apk. Keep this in step with the `match` pattern in
          # zapstore.yaml: match: "stopscroll-.*\\.apk$"
          VERSION="${GITHUB_REF_NAME#android-}"
          cp "$RUNNER_TEMP/stopscroll-release.apk" "stopscroll-${VERSION}.apk"
          sha256sum "stopscroll-${VERSION}.apk" > "stopscroll-${VERSION}.apk.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "stopscroll-${VERSION}.apk" \
            "stopscroll-${VERSION}.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "StopScroll for Android ${VERSION}" \
            --notes-file "../fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
